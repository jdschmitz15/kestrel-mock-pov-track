title: Kestrel Point Mock POV
teaser: Run an Illumio SaaS POV for a fictional insurer, from scoping sheet to readout.
description: |-
  You are the SE on a proof of value for Kestrel Point Insurance. Discovery is done and the
  scoping sheet is signed off. In this track you connect to your own Illumio SaaS PCE org,
  run pre-flight checks, onboard an AWS account to CloudSecure, install VENs on Linux and
  Windows, pair a NEN that receives IPFIX, label two apps, ringfence one, and write the readout.

  Environment per student: 8 Instruqt VMs, one AWS account (three-tier Portal app with RDS and
  VPC flow logs), and one SaaS PCE org. About two hours.
